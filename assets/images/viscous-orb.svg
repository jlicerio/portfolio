<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Viscous Orb</title>
  <desc id="desc">A glowing spherical study on a black field, with a blue center, pink lower half, and warm spectral rim.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061228"/>
      <stop offset=".28" stop-color="#0b2e69"/>
      <stop offset=".46" stop-color="#1779d4"/>
      <stop offset=".56" stop-color="#6cc7ef"/>
      <stop offset=".72" stop-color="#f0bdf2"/>
      <stop offset=".88" stop-color="#ffb0d6"/>
      <stop offset="1" stop-color="#ff6a34"/>
    </linearGradient>
    <linearGradient id="rim" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffd8b0"/>
      <stop offset=".22" stop-color="#ff9b45"/>
      <stop offset=".44" stop-color="#6effe2"/>
      <stop offset=".58" stop-color="#4cffe5"/>
      <stop offset=".8" stop-color="#ff9a51"/>
      <stop offset="1" stop-color="#ff3c18"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#ff9b45" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#ff7b2e" stop-opacity=".13"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft-small" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="orb-clip"><circle cx="600" cy="450" r="258"/></clipPath>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(17)">
      <rect width="8" height="8" fill="none"/>
      <circle cx="2" cy="2" r="1" fill="#e8f5ff" fill-opacity=".55"/>
      <circle cx="6" cy="6" r="1" fill="#e8f5ff" fill-opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#05070a"/>
  <circle cx="600" cy="450" r="430" fill="url(#aura)"/>
  <circle cx="600" cy="450" r="258" fill="url(#body)"/>
  <g clip-path="url(#orb-clip)" opacity=".52">
    <path d="M250 500 C420 380 730 420 950 505 L950 590 C740 520 450 515 250 610 Z" fill="url(#dither)"/>
  </g>
  <circle cx="600" cy="450" r="258" fill="none" stroke="url(#rim)" stroke-width="7" filter="url(#soft-small)"/>
  <circle cx="600" cy="450" r="258" fill="none" stroke="url(#rim)" stroke-width="2.2"/>
  <circle cx="600" cy="450" r="264" fill="none" stroke="#ff8c42" stroke-opacity=".35" stroke-width="15" filter="url(#soft)"/>
</svg>
