<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Hypergraphia Studio</title>
  <desc id="desc">A generative field of blue and violet rings behind the Hypergraphia Studio wordmark.</desc>
  <rect width="1200" height="900" fill="#07080a"/>
  <g fill="none" stroke-linecap="round" opacity=".8">
    <ellipse cx="600" cy="430" rx="365" ry="165" stroke="#4a89ff" stroke-width="3" transform="rotate(-18 600 430)"/>
    <ellipse cx="600" cy="430" rx="300" ry="230" stroke="#a06bff" stroke-width="2" transform="rotate(27 600 430)"/>
    <ellipse cx="600" cy="430" rx="210" ry="320" stroke="#4a89ff" stroke-width="2" transform="rotate(67 600 430)"/>
    <ellipse cx="600" cy="430" rx="420" ry="90" stroke="#d946ef" stroke-width="1" transform="rotate(4 600 430)"/>
