<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Viscous Orb</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../orb/vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
<script type="module">
// WebGL2 fluid solver adapted from the user-supplied CodePen by sabosugi.
// The orb surface is original. Three.js r186 is MIT licensed.
import * as THREE from 'three';

const query = new URLSearchParams(location.search);
const demoMode = query.has('demo');
const stillMode = query.has('still');
const ditherMode = query.get('dither') || 'veil';
const fixedTime = query.has('t') ? Number(query.get('t')) : null;
const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;

const MAX_DPR = 1.5;
const MAX_WIDTH = 1728;
const pixelRatio = () => Math.max(0.75, Math.min(window.devicePixelRatio || 1, MAX_DPR, MAX_WIDTH / Math.max(window.innerWidth, 1)));

const PARAMS = {
  trigger: 'Hover',
  radius: 0.060,
  force: 1.0,
  followSpeed: 25,
  imageDrag: 1.0,
  imageReturn: 1.1,
  liquidFade: 0.9,
  velocityFade: 1.2,
  curl: 11,
  pressure: 0.8,
  specular: 1.5,
  shininess: 36,
  surface: 1.0,
  ripple: 2.67,
  lightAngle: 125,
  simResolution: 320,
  pressureIterations: 20,
  dpr: pixelRatio()
};

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(PARAMS.dpr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const canvas = renderer.domElement;
const quadScene = new THREE.Scene();
const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeometry = new THREE.BufferGeometry();
quadGeometry.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
const quad = new THREE.Mesh(quadGeometry);
quad.frustumCulled = false;
quadScene.add(quad);

function blit(material, target) {
  quad.material = material;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, quadCamera);
}

const baseVert = /* glsl */`
  uniform vec2 texelSize;
  varying vec2 vUv;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  void main() {
    vUv = position.xy * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const capsuleChunk = /* glsl */`
  uniform float aspectRatio;
  uniform vec2 pointA;
  uniform vec2 pointB;
  uniform float radius;
  float capsuleFalloff(vec2 uv) {
    vec2 p = uv, a = pointA, b = pointB;
    p.x *= aspectRatio; a.x *= aspectRatio; b.x *= aspectRatio;
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
    float d = length(pa - ba * h);
    return exp(-d * d / (radius * radius));
  }
`;

const velocitySplatFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uTarget;
  uniform vec2 color;
  uniform float amount;
  varying vec2 vUv;
  ${capsuleChunk}
  void main() {
    float f = capsuleFalloff(vUv);
    vec2 base = texture2D(uTarget, vUv).xy;
    gl_FragColor = vec4(base + color * f * amount, 0.0, 1.0);
  }
`;

const dyeSplatFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uTarget;
  uniform float amount;
  varying vec2 vUv;
  ${capsuleChunk}
  void main() {
    float f = capsuleFalloff(vUv);
    float base = texture2D(uTarget, vUv).x;
    gl_FragColor = vec4(min(base + f * amount, 1.0), 0.0, 0.0, 1.0);
  }
`;

const advectionFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  uniform vec2 texelSize;
  uniform float dt;
  uniform float dissipation;
  uniform float velocityScale;
  varying vec2 vUv;
  void main() {
    vec2 coord = vUv - dt * velocityScale * texture2D(uVelocity, vUv).xy * texelSize;
    gl_FragColor = texture2D(uSource, coord) / (1.0 + dissipation * dt);
  }
`;

const displacementFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  uniform sampler2D uDisplacement;
  uniform sampler2D uDye;
  uniform vec2 texelSize;
  uniform float dt;
  uniform float decay;
  uniform float drag;
  varying vec2 vUv;
  void main() {
    float wet = smoothstep(0.0, 0.2, texture2D(uDye, vUv).x);
    vec2 step = dt * drag * wet * texture2D(uVelocity, vUv).xy * texelSize;
    vec2 d = texture2D(uDisplacement, vUv - step).xy - step;
    d *= mix(decay * decay * decay, decay, wet);
    gl_FragColor = vec4(d, 0.0, 1.0);
  }
`;

const divergenceFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) L = -C.x;
    if (vR.x > 1.0) R = -C.x;
    if (vT.y > 1.0) T = -C.y;
    if (vB.y < 0.0) B = -C.y;
    gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
  }
`;

const curlFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  varying vec2 vL, vR, vT, vB;
  void main() {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
  }
`;

const vorticityFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  uniform float curl;
  uniform float dt;
  varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 vel = texture2D(uVelocity, vUv).xy + force * dt;
    gl_FragColor = vec4(clamp(vel, -1000.0, 1000.0), 0.0, 1.0);
  }
`;

const clearFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uTexture;
  uniform float value;
  varying vec2 vUv;
  void main() { gl_FragColor = value * texture2D(uTexture, vUv); }
`;

const pressureFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float div = texture2D(uDivergence, vUv).x;
    gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
  }
`;

const gradientSubtractFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 vel = texture2D(uVelocity, vUv).xy - vec2(R - L, T - B);
    gl_FragColor = vec4(vel, 0.0, 1.0);
  }
`;

const displayFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uDisplacement;
  uniform sampler2D uDye;
  uniform sampler2D uVelocity;
  uniform vec2 uSimTexel;
  uniform vec2 uResolution;
  uniform float uAspect;
  uniform float uOrbRadius;
  uniform float uTime;
  uniform float uSpecular;
  uniform float uShininess;
  uniform float uSurface;
  uniform float uRipple;
  uniform vec3 uLightDir;
  varying vec2 vUv;

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  vec3 bodyColor(float y) {
    vec3 c = vec3(1.0, 0.318, 0.125);
    c = mix(c, vec3(1.0, 0.698, 0.604), smoothstep(0.05, 0.14, y));
    c = mix(c, vec3(0.961, 0.741, 0.859), smoothstep(0.10, 0.22, y));
    c = mix(c, vec3(0.941, 0.741, 0.949), smoothstep(0.18, 0.34, y));
    c = mix(c, vec3(0.471, 0.769, 0.937), smoothstep(0.26, 0.42, y));
    c = mix(c, vec3(0.106, 0.561, 1.0), smoothstep(0.34, 0.50, y));
    c = mix(c, vec3(0.063, 0.278, 0.831), smoothstep(0.42, 0.56, y));
    c = mix(c, vec3(0.024, 0.071, 0.157), smoothstep(0.46, 0.76, y));
    c *= mix(0.18, 1.0, 1.0 - smoothstep(0.68, 0.94, y));
    return c;
  }

  void main() {
    vec2 uv = vUv;
    vec2 disp = texture2D(uDisplacement, uv).xy;
    float dye = texture2D(uDye, uv).x;
    vec2 vel = texture2D(uVelocity, uv).xy;
    float speed = length(vel);

    vec2 baseP = (uv - 0.5) * vec2(uAspect, 1.0);
    vec2 bodyP = baseP + disp * vec2(uAspect, 1.0) * 0.36;
    vec2 p = baseP + disp * vec2(uAspect, 1.0) * 0.18;

    float r = length(p);
    float rn = r / uOrbRadius;
    float edgeAA = 1.8 / (uOrbRadius * uResolution.y);
    float inside = 1.0 - smoothstep(1.0 - edgeAA, 1.0 + edgeAA, rn);
    vec2 sphereXY = p / uOrbRadius;
    float nz = sqrt(max(0.0, 1.0 - dot(sphereXY, sphereXY)));
    float y = clamp(sphereXY.y * 0.5 + 0.5, 0.0, 1.0);
    float bodyY = clamp((bodyP.y / uOrbRadius) * 0.5 + 0.5, 0.0, 1.0);
    float edge = pow(1.0 - nz, 4.6);
    float thinEdge = pow(1.0 - nz, 22.0);

    vec2 tx = vec2(uSimTexel.x, 0.0);
    vec2 ty = vec2(0.0, uSimTexel.y);
    float hC = dye * 0.6 + speed * uRipple * 0.004 * smoothstep(0.0, 0.3, dye);
    float hL = texture2D(uDye, uv - tx).x * 0.6 + length(texture2D(uVelocity, uv - tx).xy) * uRipple * 0.004 * smoothstep(0.0, 0.3, texture2D(uDye, uv - tx).x);
    float hR = texture2D(uDye, uv + tx).x * 0.6 + length(texture2D(uVelocity, uv + tx).xy) * uRipple * 0.004 * smoothstep(0.0, 0.3, texture2D(uDye, uv + tx).x);
    float hT = texture2D(uDye, uv + ty).x * 0.6 + length(texture2D(uVelocity, uv + ty).xy) * uRipple * 0.004 * smoothstep(0.0, 0.3, texture2D(uDye, uv + ty).x);
    float hB = texture2D(uDye, uv - ty).x * 0.6 + length(texture2D(uVelocity, uv - ty).xy) * uRipple * 0.004 * smoothstep(0.0, 0.3, texture2D(uDye, uv - ty).x);
    vec2 grad = vec2(hR - hL, hT - hB) * 0.5;
    vec3 nf = normalize(vec3(-grad * uSurface * 6.0, 1.0));

    vec3 body = bodyColor(bodyY);
    float midBand = smoothstep(0.38, 0.52, bodyY) * (1.0 - smoothstep(0.54, 0.66, bodyY));
    body = mix(body, vec3(0.412, 0.698, 0.859), midBand * 0.62);
    body = mix(body, vec3(0.941, 0.741, 0.949), clamp(dye, 0.0, 1.0) * 0.045);

    vec3 H = normalize(uLightDir + vec3(0.0, 0.0, 1.0));
    float spec = pow(max(dot(nf, H), 0.0), uShininess);
    body += mix(vec3(0.55, 0.86, 1.0), vec3(1.0, 0.72, 0.52), y) * spec * uSpecular * 0.025 * smoothstep(0.0, 0.5, dye);
    body += vec3(0.82, 0.94, 1.0) * pow(clamp(dye, 0.0, 1.0), 2.0) * 0.055;

    float side = smoothstep(0.12, 0.86, abs(sphereXY.x));
    float top = smoothstep(0.28, 0.97, sphereXY.y);
    float bottom = smoothstep(0.18, 0.90, -sphereXY.y);
    vec3 rimC = mix(vec3(0.047, 0.271, 0.847), vec3(0.275, 1.0, 0.886), side * 0.78);
    vec3 warmTop = mix(vec3(1.0, 0.318, 0.125), vec3(1.0, 0.890, 0.760), pow(top, 7.0));
    vec3 warmBottom = mix(vec3(1.0, 0.212, 0.094), vec3(1.0, 0.604, 0.322), pow(bottom, 4.0));
    rimC = mix(rimC, warmTop, top * 0.92);
    rimC = mix(rimC, warmBottom, bottom * 0.88);
    rimC += vec3(0.725, 1.0, 0.714) * side * 0.16 * (1.0 - top) * (1.0 - bottom);

    float innerShade = mix(1.0, 0.24, smoothstep(0.72, 0.995, rn));
    float rimBand = exp(-pow((rn - 1.0) / 0.020, 2.0));
    float coreLine = exp(-pow((rn - 0.997) / 0.006, 2.0));
    vec3 color = body * innerShade;
    color += rimC * rimBand * 1.20;
    color += mix(rimC, vec3(1.0), top * 0.68) * coreLine * 0.52;

    float d = abs(rn - 1.0);
    float halo = exp(-pow(d / 0.11, 2.0));
    float broadHalo = exp(-pow(d / 0.34, 2.0));
    float sideBand = smoothstep(0.42, 0.55, y) * (1.0 - smoothstep(0.61, 0.76, y));
    vec3 haloC = mix(vec3(1.0, 0.30, 0.025), vec3(0.28, 1.0, 0.86), sideBand);
    haloC = mix(haloC, vec3(1.0, 0.16, 0.02), (1.0 - smoothstep(0.08, 0.34, y)) * 0.72);

    color = color * inside;
    color += haloC * halo * 0.25;
    color += haloC * broadHalo * 0.018;

    float grain = (hash21(gl_FragCoord.xy + vec2(uTime * 60.0)) - 0.5) * 0.010;
    color += grain * (0.25 + inside * 0.75);
    color = max(color, vec3(0.0));
    gl_FragColor = vec4(color, 1.0);
  }
`;

const brightFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uScene;
  uniform float uThreshold;
  varying vec2 vUv;
  void main() {
    vec3 c = texture2D(uScene, vUv).rgb;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float w = smoothstep(uThreshold, uThreshold + 0.18, l);
    gl_FragColor = vec4(c * w, 1.0);
  }
`;

const blurFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uTexture;
  uniform vec2 uTexel;
  uniform vec2 uDirection;
  uniform float uRadius;
  varying vec2 vUv;
  void main() {
    vec2 o = uTexel * uDirection * uRadius;
    vec3 c = texture2D(uTexture, vUv).rgb * 0.2270270270;
    c += texture2D(uTexture, vUv + o * 1.3846153846).rgb * 0.3162162162;
    c += texture2D(uTexture, vUv - o * 1.3846153846).rgb * 0.3162162162;
    c += texture2D(uTexture, vUv + o * 3.2307692308).rgb * 0.0702702703;
    c += texture2D(uTexture, vUv - o * 3.2307692308).rgb * 0.0702702703;
    gl_FragColor = vec4(c, 1.0);
  }
`;

const ditherFieldFrag = /* glsl */`
  precision highp float;
  uniform float uTime;
  uniform float uAspect;
  varying vec2 vUv;

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float valueNoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
               mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
  }

  float cloud(vec2 p) {
    float value = 0.0;
    float amp = 0.55;
    for (int i = 0; i < 4; i++) {
      value += amp * abs(valueNoise(p));
      p *= 2.03;
      amp *= 0.55;
    }
    return value;
  }

  void main() {
    vec2 q = (vUv - 0.5) * vec2(uAspect, 1.0);
    float t = uTime * 0.05;
    vec2 warp = vec2(cloud(q * 1.0 + vec2(t, 0.0)), cloud(q * 1.0 + vec2(0.0, -t)));
    float field = cloud(q * 1.55 + warp * 0.9 + vec2(t * 0.2, -t * 0.11));
    field = smoothstep(0.16, 0.62, field);
    gl_FragColor = vec4(field, 0.0, 0.0, 1.0);
  }
`;

const compositeFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uScene;
  uniform sampler2D uBloom;
  uniform sampler2D uDitherField;
  uniform sampler2D uDye;
  uniform sampler2D uVelocity;
  uniform sampler2D uBayer;
  uniform vec2 uSceneTexel;
  uniform vec2 uResolution;
  uniform float uBloomStrength;
  uniform float uSoftness;
  uniform float uCellPx;
  uniform float uAspect;
  uniform float uOrbRadius;
  uniform float uDitherAmount;
  uniform float uVeilAmount;
  uniform float uTime;
  varying vec2 vUv;

  void main() {
    vec2 t = uSceneTexel * 2.2;
    vec3 sharp = texture2D(uScene, vUv).rgb;
    vec3 soft = sharp * 0.25;
    soft += texture2D(uScene, vUv + vec2(t.x, 0.0)).rgb * 0.125;
    soft += texture2D(uScene, vUv - vec2(t.x, 0.0)).rgb * 0.125;
    soft += texture2D(uScene, vUv + vec2(0.0, t.y)).rgb * 0.125;
    soft += texture2D(uScene, vUv - vec2(0.0, t.y)).rgb * 0.125;
    soft += texture2D(uScene, vUv + vec2(t.x, t.y)).rgb * 0.0625;
    soft += texture2D(uScene, vUv + vec2(-t.x, t.y)).rgb * 0.0625;
    soft += texture2D(uScene, vUv + vec2(t.x, -t.y)).rgb * 0.0625;
    soft += texture2D(uScene, vUv - vec2(t.x, t.y)).rgb * 0.0625;

    vec3 color = mix(sharp, soft, uSoftness);
    color += texture2D(uBloom, vUv).rgb * uBloomStrength;

    vec2 cell = floor(gl_FragCoord.xy / uCellPx);
    float field = texture2D(uDitherField, vUv).r;
    float threshold = texture2D(uBayer, (mod(cell, 8.0) + 0.5) / 8.0).r;
    float levels = 4.0;
    float band = floor(field * (levels - 1.0) + threshold);
    float ditherShade = clamp(band / (levels - 1.0), 0.0, 1.0);
    float rn = length((vUv - 0.5) * vec2(uAspect, 1.0)) / uOrbRadius;
    float outside = smoothstep(1.0, 1.09, rn);
    color += vec3(0.68, 0.66, 0.76) * ditherShade * outside * uDitherAmount;

    vec2 cellUv = (cell + 0.5) * uCellPx / uResolution;
    float inside = 1.0 - smoothstep(0.985, 1.015, rn);
    float dye = texture2D(uDye, cellUv).x;
    float speed = length(texture2D(uVelocity, cellUv).xy);
    float veil = smoothstep(0.02, 0.20, dye + speed * 0.015) * inside;
    vec3 cellColor = texture2D(uScene, cellUv).rgb;
    float cellLum = dot(cellColor, vec3(0.2126, 0.7152, 0.0722));
    float veilLevels = 2.0;
    float veilBand = floor(clamp(cellLum, 0.0, 1.0) * (veilLevels - 1.0) + threshold);
    float veilShade = clamp(veilBand / (veilLevels - 1.0), 0.0, 1.0);
    vec3 veilPaper = mix(vec3(0.72, 0.84, 1.0), cellColor * 1.2, 0.28);
    vec3 veilColor = mix(vec3(0.012, 0.018, 0.045), veilPaper, veilShade);
    color = mix(color, veilColor, veil * uVeilAmount);

    float grain = fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
    color += grain * 0.007;
    gl_FragColor = vec4(max(color, vec3(0.0)), 1.0);
  }
`;

const simTexel = new THREE.Vector2(1 / 256, 1 / 256);
const simSize = new THREE.Vector2(256, 256);

function makeMaterial(fragmentShader, uniforms) {
  return new THREE.ShaderMaterial({
    vertexShader: baseVert,
    fragmentShader,
    uniforms: Object.assign({ texelSize: { value: simTexel } }, uniforms),
    depthTest: false,
    depthWrite: false
  });
}

function capsuleUniforms() {
  return {
    uTarget: { value: null },
    aspectRatio: { value: 1 },
    pointA: { value: new THREE.Vector2() },
    pointB: { value: new THREE.Vector2() },
    radius: { value: PARAMS.radius }
  };
}

const velocitySplatMat = makeMaterial(velocitySplatFrag, Object.assign(capsuleUniforms(), {
  color: { value: new THREE.Vector2() },
  amount: { value: 1 }
}));
const dyeSplatMat = makeMaterial(dyeSplatFrag, Object.assign(capsuleUniforms(), {
  amount: { value: 1 }
}));
const advectionMat = makeMaterial(advectionFrag, {
  uVelocity: { value: null }, uSource: { value: null },
  dt: { value: 0 }, dissipation: { value: 0 }, velocityScale: { value: 1 }
});
const displacementMat = makeMaterial(displacementFrag, {
  uVelocity: { value: null }, uDisplacement: { value: null }, uDye: { value: null },
  dt: { value: 0 }, decay: { value: 1 }, drag: { value: PARAMS.imageDrag }
});
const divergenceMat = makeMaterial(divergenceFrag, { uVelocity: { value: null } });
const curlMat = makeMaterial(curlFrag, { uVelocity: { value: null } });
const vorticityMat = makeMaterial(vorticityFrag, {
  uVelocity: { value: null }, uCurl: { value: null },
  curl: { value: PARAMS.curl }, dt: { value: 0 }
});
const clearMat = makeMaterial(clearFrag, { uTexture: { value: null }, value: { value: PARAMS.pressure } });
const pressureMat = makeMaterial(pressureFrag, { uPressure: { value: null }, uDivergence: { value: null } });
const gradientMat = makeMaterial(gradientSubtractFrag, { uPressure: { value: null }, uVelocity: { value: null } });

const lightDir = new THREE.Vector3();
function updateLightDir() {
  const a = THREE.MathUtils.degToRad(PARAMS.lightAngle);
  lightDir.set(Math.cos(a), Math.sin(a), 1.2).normalize();
}
updateLightDir();

const displayMat = makeMaterial(displayFrag, {
  uDisplacement: { value: null },
  uDye: { value: null },
  uVelocity: { value: null },
  uSimTexel: { value: simTexel },
  uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  uAspect: { value: window.innerWidth / window.innerHeight },
  uOrbRadius: { value: 0.31 },
  uTime: { value: 0 },
  uSpecular: { value: PARAMS.specular },
  uShininess: { value: PARAMS.shininess },
  uSurface: { value: PARAMS.surface },
  uRipple: { value: PARAMS.ripple },
  uLightDir: { value: lightDir }
});

function makePostMaterial(fragmentShader, uniforms) {
  return new THREE.ShaderMaterial({
    vertexShader: baseVert,
    fragmentShader,
    uniforms: Object.assign({ texelSize: { value: new THREE.Vector2() } }, uniforms),
    depthTest: false,
    depthWrite: false
  });
}

const brightMat = makePostMaterial(brightFrag, {
  uScene: { value: null },
  uThreshold: { value: 0.74 }
});

const bayerValues = [
  0, 32, 8, 40, 2, 34, 10, 42,
  48, 16, 56, 24, 50, 18, 58, 26,
  12, 44, 4, 36, 14, 46, 6, 38,
  60, 28, 52, 20, 62, 30, 54, 22,
  3, 35, 11, 43, 1, 33, 9, 41,
  51, 19, 59, 27, 49, 17, 57, 25,
  15, 47, 7, 39, 13, 45, 5, 37,
  63, 31, 55, 23, 61, 29, 53, 21
];
const bayerData = new Uint8Array(64 * 4);
for (let i = 0; i < 64; i++) {
  const v = Math.round((bayerValues[i] / 64) * 255);
  bayerData[i * 4] = v;
  bayerData[i * 4 + 1] = v;
  bayerData[i * 4 + 2] = v;
  bayerData[i * 4 + 3] = 255;
}
const bayerTexture = new THREE.DataTexture(bayerData, 8, 8, THREE.RGBAFormat);
bayerTexture.minFilter = THREE.NearestFilter;
bayerTexture.magFilter = THREE.NearestFilter;
bayerTexture.wrapS = bayerTexture.wrapT = THREE.ClampToEdgeWrapping;
bayerTexture.needsUpdate = true;
const blurMat = makePostMaterial(blurFrag, {
  uTexture: { value: null },
  uTexel: { value: new THREE.Vector2() },
  uDirection: { value: new THREE.Vector2(1, 0) },
  uRadius: { value: 1.4 }
});
const ditherMat = makePostMaterial(ditherFieldFrag, {
  uTime: { value: 0 },
  uAspect: { value: 1 }
});
const compositeMat = makePostMaterial(compositeFrag, {
  uScene: { value: null },
  uBloom: { value: null },
  uDitherField: { value: null },
  uDye: { value: null },
  uVelocity: { value: null },
  uBayer: { value: bayerTexture },
  uSceneTexel: { value: new THREE.Vector2() },
  uResolution: { value: new THREE.Vector2(1, 1) },
  uBloomStrength: { value: 0.65 },
  uSoftness: { value: 0.42 },
  uCellPx: { value: 6 },
  uAspect: { value: 1 },
  uOrbRadius: { value: 0.31 },
  uDitherAmount: { value: ditherMode === 'veil' ? 0.0 : 0.20 },
  uVeilAmount: { value: ditherMode === 'field' ? 0.0 : 0.90 },
  uTime: { value: 0 }
});

let sceneTarget = null;
let bloomTargetA = null;
let bloomTargetB = null;
let ditherTarget = null;

function makeColorTarget(width, height) {
  return new THREE.WebGLRenderTarget(width, height, {
    type: THREE.HalfFloatType,
    format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false,
    stencilBuffer: false,
    generateMipmaps: false
  });
}

function disposePostTargets() {
  sceneTarget?.dispose();
  bloomTargetA?.dispose();
  bloomTargetB?.dispose();
  ditherTarget?.dispose();
}

function buildPost() {
  disposePostTargets();
  const width = canvas.width;
  const height = canvas.height;
  const bw = Math.max(1, Math.floor(width / 4));
  const bh = Math.max(1, Math.floor(height / 4));
  sceneTarget = makeColorTarget(width, height);
  bloomTargetA = makeColorTarget(bw, bh);
  bloomTargetB = makeColorTarget(bw, bh);
  ditherTarget = makeColorTarget(Math.max(1, Math.floor(width / 8)), Math.max(1, Math.floor(height / 8)));
  blurMat.uniforms.uTexel.value.set(1 / bw, 1 / bh);
  compositeMat.uniforms.uSceneTexel.value.set(1 / width, 1 / height);
  compositeMat.uniforms.uScene.value = sceneTarget.texture;
  compositeMat.uniforms.uDitherField.value = ditherTarget.texture;
}

function createTarget(w, h, filter) {
  return new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType,
    format: THREE.RGBAFormat,
    minFilter: filter,
    magFilter: filter,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false,
    stencilBuffer: false,
    generateMipmaps: false
  });
}

function createDoubleTarget(w, h, filter) {
  return {
    read: createTarget(w, h, filter),
    write: createTarget(w, h, filter),
    swap() { const t = this.read; this.read = this.write; this.write = t; },
    dispose() { this.read.dispose(); this.write.dispose(); }
  };
}

const sim = { velocity: null, dye: null, displacement: null, pressure: null, divergence: null, curl: null };

function getSimResolution(resolution) {
  let aspect = canvas.width / canvas.height;
  if (aspect < 1) aspect = 1 / aspect;
  const min = Math.round(resolution);
  const max = Math.round(resolution * aspect);
  return canvas.width > canvas.height ? { w: max, h: min } : { w: min, h: max };
}

function disposeSim() {
  if (!sim.velocity) return;
  for (const key of ['velocity', 'dye', 'displacement', 'pressure']) sim[key].dispose();
  sim.divergence.dispose();
  sim.curl.dispose();
}

function clearTarget(target) {
  renderer.setRenderTarget(target);
  renderer.clear(true, false, false);
}

function clearFluid() {
  if (!sim.velocity) return;
  renderer.setClearColor(0x000000, 0);
  for (const key of ['velocity', 'dye', 'displacement', 'pressure']) {
    clearTarget(sim[key].read);
    clearTarget(sim[key].write);
  }
  renderer.setClearColor(0x000000, 1);
  renderer.setRenderTarget(null);
}

function buildSim() {
  const { w, h } = getSimResolution(PARAMS.simResolution);
  if (sim.velocity && simSize.x === w && simSize.y === h) return;
  disposeSim();
  simSize.set(w, h);
  simTexel.set(1 / w, 1 / h);
  sim.velocity = createDoubleTarget(w, h, THREE.LinearFilter);
  sim.dye = createDoubleTarget(w, h, THREE.LinearFilter);
  sim.displacement = createDoubleTarget(w, h, THREE.LinearFilter);
  sim.pressure = createDoubleTarget(w, h, THREE.NearestFilter);
  sim.divergence = createTarget(w, h, THREE.NearestFilter);
  sim.curl = createTarget(w, h, THREE.NearestFilter);
  clearFluid();
}

function setCapsule(mat, ax, ay, bx, by) {
  const u = mat.uniforms;
  u.aspectRatio.value = canvas.width / canvas.height;
  u.pointA.value.set(ax, ay);
  u.pointB.value.set(bx, by);
  u.radius.value = PARAMS.radius;
}

function splat(ax, ay, bx, by, vx, vy) {
  const aspect = canvas.width / canvas.height;
  const segment = Math.hypot((bx - ax) * aspect, by - ay);
  const amount = Math.min(segment / (PARAMS.radius * 1.8), 1.0);

  setCapsule(velocitySplatMat, ax, ay, bx, by);
  velocitySplatMat.uniforms.uTarget.value = sim.velocity.read.texture;
  velocitySplatMat.uniforms.color.value.set(vx, vy);
  velocitySplatMat.uniforms.amount.value = amount;
  blit(velocitySplatMat, sim.velocity.write);
  sim.velocity.swap();

  setCapsule(dyeSplatMat, ax, ay, bx, by);
  dyeSplatMat.uniforms.uTarget.value = sim.dye.read.texture;
  dyeSplatMat.uniforms.amount.value = amount;
  blit(dyeSplatMat, sim.dye.write);
  sim.dye.swap();
}

function stepFluid(dt) {
  curlMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  blit(curlMat, sim.curl);

  vorticityMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  vorticityMat.uniforms.uCurl.value = sim.curl.texture;
  vorticityMat.uniforms.curl.value = PARAMS.curl;
  vorticityMat.uniforms.dt.value = dt;
  blit(vorticityMat, sim.velocity.write);
  sim.velocity.swap();

  divergenceMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  blit(divergenceMat, sim.divergence);

  clearMat.uniforms.uTexture.value = sim.pressure.read.texture;
  clearMat.uniforms.value.value = PARAMS.pressure;
  blit(clearMat, sim.pressure.write);
  sim.pressure.swap();

  pressureMat.uniforms.uDivergence.value = sim.divergence.texture;
  for (let i = 0; i < PARAMS.pressureIterations; i++) {
    pressureMat.uniforms.uPressure.value = sim.pressure.read.texture;
    blit(pressureMat, sim.pressure.write);
    sim.pressure.swap();
  }

  gradientMat.uniforms.uPressure.value = sim.pressure.read.texture;
  gradientMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  blit(gradientMat, sim.velocity.write);
  sim.velocity.swap();

  displacementMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  displacementMat.uniforms.uDisplacement.value = sim.displacement.read.texture;
  displacementMat.uniforms.uDye.value = sim.dye.read.texture;
  displacementMat.uniforms.dt.value = dt;
  displacementMat.uniforms.drag.value = PARAMS.imageDrag;
  displacementMat.uniforms.decay.value = Math.exp(-PARAMS.imageReturn * dt);
  blit(displacementMat, sim.displacement.write);
  sim.displacement.swap();

  advectionMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  advectionMat.uniforms.uSource.value = sim.dye.read.texture;
  advectionMat.uniforms.dt.value = dt;
  advectionMat.uniforms.dissipation.value = PARAMS.liquidFade;
  advectionMat.uniforms.velocityScale.value = 0.35;
  blit(advectionMat, sim.dye.write);
  sim.dye.swap();

  advectionMat.uniforms.uSource.value = sim.velocity.read.texture;
  advectionMat.uniforms.dissipation.value = PARAMS.velocityFade;
  advectionMat.uniforms.velocityScale.value = 1.0;
  blit(advectionMat, sim.velocity.write);
  sim.velocity.swap();
}

const pointer = {
  tx: 0.5, ty: 0.5,
  x: 0.5, y: 0.5,
  px: 0.5, py: 0.5,
  inside: false,
  down: false,
  ready: false
};

function setPointerTarget(e) {
  const rect = canvas.getBoundingClientRect();
  pointer.tx = (e.clientX - rect.left) / rect.width;
  pointer.ty = 1 - (e.clientY - rect.top) / rect.height;
}

function snapPointer() {
  pointer.x = pointer.px = pointer.tx;
  pointer.y = pointer.py = pointer.ty;
  pointer.ready = true;
}

canvas.addEventListener('pointermove', (e) => {
  setPointerTarget(e);
  pointer.inside = true;
  lastHumanInput = performance.now();
  if (!pointer.ready) snapPointer();
});
canvas.addEventListener('pointerdown', (e) => {
  setPointerTarget(e);
  pointer.down = true;
  pointer.inside = true;
  lastHumanInput = performance.now();
  snapPointer();
});
window.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('pointerleave', () => {
  pointer.inside = false;
  pointer.down = false;
  pointer.ready = false;
});

function updatePointer(dt) {
  pointer.px = pointer.x;
  pointer.py = pointer.y;
  const k = 1 - Math.exp(-dt * PARAMS.followSpeed);
  pointer.x += (pointer.tx - pointer.x) * k;
  pointer.y += (pointer.ty - pointer.y) * k;

  const active = PARAMS.trigger === 'Hover'
    ? (pointer.inside && pointer.ready)
    : (pointer.down && pointer.ready);
  if (!active) return;

  const dx = pointer.x - pointer.px;
  const dy = pointer.y - pointer.py;
  if (dx * dx + dy * dy < 1e-10) return;
  const f = PARAMS.force / Math.max(dt, 1 / 240);
  splat(pointer.px, pointer.py, pointer.x, pointer.y, dx * simSize.x * f, dy * simSize.y * f);
}

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setPixelRatio(pixelRatio());
  renderer.setSize(width, height);
  const aspect = width / Math.max(height, 1);
  displayMat.uniforms.uResolution.value.set(width, height);
  displayMat.uniforms.uAspect.value = aspect;
  displayMat.uniforms.uOrbRadius.value = Math.min(0.415 * aspect, 0.31);
  compositeMat.uniforms.uCellPx.value = 3 * renderer.getPixelRatio();
  compositeMat.uniforms.uResolution.value.set(canvas.width, canvas.height);
  compositeMat.uniforms.uAspect.value = aspect;
  compositeMat.uniforms.uOrbRadius.value = displayMat.uniforms.uOrbRadius.value;
  ditherMat.uniforms.uAspect.value = aspect;
  buildPost();
  buildSim();
}

addEventListener('resize', resize);
resize();

let elapsed = fixedTime ?? 0;
let lastTime = performance.now();
let lastHumanInput = -Infinity;
const ambient = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, ready: false };
window.__FLUID__ = { renderer, sim, PARAMS };

function updateAmbient(now, dt) {
  if (stillMode || demoMode || now - lastHumanInput < 1200) {
    ambient.ready = false;
    return;
  }

  const aspect = canvas.width / Math.max(canvas.height, 1);
  const ry = displayMat.uniforms.uOrbRadius.value;
  const rx = ry / Math.max(aspect, 1e-5);
  const t = elapsed * 0.62;
  const x = 0.5 + Math.cos(t) * rx * 0.82;
  const y = 0.5 + Math.sin(t * 1.7) * ry * 0.26;

  if (!ambient.ready) {
    ambient.x = ambient.px = x;
    ambient.y = ambient.py = y;
    ambient.ready = true;
    return;
  }

  ambient.px = ambient.x;
  ambient.py = ambient.y;
  ambient.x = x;
  ambient.y = y;
  const dx = ambient.x - ambient.px;
  const dy = ambient.y - ambient.py;
  if (dx * dx + dy * dy < 1e-10) return;
  const f = 0.75 / Math.max(dt, 1 / 240);
  splat(ambient.px, ambient.py, ambient.x, ambient.y, dx * simSize.x * f, dy * simSize.y * f);
}

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = stillMode || reduceMotion ? 0 : Math.min(Math.max((now - lastTime) / 1000, 1 / 240), 1 / 30);
  lastTime = now;
  elapsed += dt;

  if (demoMode && !stillMode) {
    pointer.inside = true;
    pointer.ready = true;
    pointer.tx = 0.5 + Math.cos(elapsed * 0.9) * 0.18;
    pointer.ty = 0.5 + Math.sin(elapsed * 1.2) * 0.15;
  }

  if (dt > 0) {
    updatePointer(dt);
    updateAmbient(now, dt);
    stepFluid(dt);
  }

  displayMat.uniforms.uDisplacement.value = sim.displacement.read.texture;
  displayMat.uniforms.uDye.value = sim.dye.read.texture;
  displayMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  displayMat.uniforms.uTime.value = elapsed;
  compositeMat.uniforms.uTime.value = elapsed;

  blit(displayMat, sceneTarget);

  brightMat.uniforms.uScene.value = sceneTarget.texture;
  blit(brightMat, bloomTargetA);

  blurMat.uniforms.uTexture.value = bloomTargetA.texture;
  blurMat.uniforms.uDirection.value.set(1, 0);
  blurMat.uniforms.uRadius.value = 1.35;
  blit(blurMat, bloomTargetB);

  blurMat.uniforms.uTexture.value = bloomTargetB.texture;
  blurMat.uniforms.uDirection.value.set(0, 1);
  blit(blurMat, bloomTargetA);

  blurMat.uniforms.uTexture.value = bloomTargetA.texture;
  blurMat.uniforms.uDirection.value.set(1, 0);
  blurMat.uniforms.uRadius.value = 2.8;
  blit(blurMat, bloomTargetB);

  blurMat.uniforms.uTexture.value = bloomTargetB.texture;
  blurMat.uniforms.uDirection.value.set(0, 1);
  blit(blurMat, bloomTargetA);

  ditherMat.uniforms.uTime.value = elapsed;
  blit(ditherMat, ditherTarget);

  compositeMat.uniforms.uScene.value = sceneTarget.texture;
  compositeMat.uniforms.uBloom.value = bloomTargetA.texture;
  compositeMat.uniforms.uDye.value = sim.dye.read.texture;
  compositeMat.uniforms.uVelocity.value = sim.velocity.read.texture;
  blit(compositeMat, null);
});
</script>
</body>
</html>
