<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warp and Weft</title>
<style>
  html, body { margin: 0; height: 100%; background: #050d06; overflow: hidden; }
  #view { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script type="module">
  import { runStudy } from '../engine/run.js';
  const mobile = window.innerWidth < 700;
  const chairPosition = mobile ? [0.95, 0, -3.9] : [0.5, 0, -1.5];
  runStudy(document.querySelector('#view'), {
    weave: true,
    bladeScale: 0.82,
    chair: {
      url: '../chair.gltf',
      position: chairPosition,
      rotationY: -0.6,
      scale: mobile ? 2.2 : 1.4,
      tint: [0.9, 0.9, 0.87],
      alignCell: true,
    },
    post: { glow: 0.45, grain: 0.021, vignette: 0.62 },
    path: { start: [2.6, 4.4], end: [chairPosition[0], chairPosition[2]] },
    pointer: true,
    pointerRadius: 2.4,
    wind: 1.35,
  });
</script>
</body>
</html>
