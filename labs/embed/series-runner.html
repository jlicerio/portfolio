<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series Runner</title>
<style>
  :root{--bg:#07080a;--ink:#f2f0ec;--muted:#a8a4ad;--line:rgba(242,240,236,.18)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
  .wrap{max-width:1440px;margin:0 auto;padding:24px 4vw 50px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:14px}
  h1{font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:.95;letter-spacing:-.04em;font-weight:500;margin:0}
  .meta{font:10px 'DM Mono',ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;line-height:1.8}
  .meta b{color:var(--ink);font-weight:400}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font:10px 'DM Mono',ui-monospace,monospace;letter-spacing:.09em;padding:8px 12px;cursor:pointer;text-transform:uppercase}
  button:hover,button:focus-visible{border-color:var(--ink);color:var(--ink);outline:none}
  button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:rgba(242,240,236,.08)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;max-height:calc(100vh - 210px)}
  .draw{position:relative;border:1px solid var(--line);background:#0a0b0e;aspect-ratio:4/3;overflow:hidden}
  .draw canvas{display:block;width:100%;height:100%}
  .draw .idx{position:absolute;left:8px;top:8px;font:9px 'DM Mono',ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);background:rgba(7,8,10,.8);padding:3px 6px}
  .draw .ops{position:absolute;left:8px;right:8px;bottom:8px;font:8.5px 'DM Mono',ui-monospace,monospace;letter-spacing:.04em;color:var(--muted);background:rgba(7,8,10,.82);padding:4px 6px;line-height:1.5}
  .draw .ops b{color:var(--ink);font-weight:400}
  .draw .keep{position:absolute;right:8px;top:8px;font-size:9px;padding:4px 8px}
  .draw.is-kept{border-color:var(--ink)}
  .draw.is-kept::after{content:'';position:absolute;inset:0;border:1px solid var(--ink);pointer-events:none}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font:10px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;line-height:1.9}
  footer b{color:var(--ink);font-weight:400}
  #kept{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Series runner</h1>
    <div class="meta"><b>Biomorphic series</b><br>2 base forms · 6 operators · bounds in JSON</div>
  </header>

  <div class="controls">
    <button type="button" id="reroll">Reroll · seed <b id="seed">114</b></button>
    <button type="button" data-form="diatom" aria-pressed="true">Diatom</button>
    <button type="button" data-form="blob" aria-pressed="false">Blob</button>
    <button type="button" data-mode="dither" aria-pressed="true">Dither</button>
    <button type="button" data-mode="ascii" aria-pressed="false">ASCII</button>
    <button type="button" id="reset">Clear kept</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>Kept: <b id="keptCount">0</b> · <span id="kept">none</span></span>
    <span>seed picks inside the bounds · never sets them</span>
  </footer>
</div>

<script>
window.__study = { ready: false, frames: 0, error: null, draws: 0, kept: 0 };

const TAU = Math.PI * 2;
const BAYER2 = [[0, 2], [3, 1]];
const BAYER4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const BAYER8 = (() => {
  const m = [];
  for (let y = 0; y < 8; y += 1) { m.push([]); for (let x = 0; x < 8; x += 1) m[y].push((BAYER4[y % 4][x % 4] * 4 + BAYER2[(y / 4 | 0) % 2][(x / 4 | 0) % 2] + 0.5) / 64); }
  return m;
})();
const GLYPHS = ' .:-=+*#%@';

function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const pick = (random, spec) => {
  if (spec.values) return spec.values[Math.floor(random() * spec.values.length)];
  const raw = spec.min + random() * (spec.max - spec.min);
  const step = spec.step || 0.01;
  return Math.round(raw / step) * step;
};

const state = { config: null, seed: 114, mode: 'dither', form: 'diatom', kept: new Set(), draws: [] };

async function load() {
  const response = await fetch('../../data/series/biomorphic.json', { cache: 'no-store' });
  state.config = await response.json();
  const params = new URLSearchParams(location.search);
  state.seed = Number(params.get('seed')) || state.config.seed;
  state.form = params.get('form') || state.config.defaultForm || 'blob';
  for (const button of document.querySelectorAll('[data-form]')) {
    button.setAttribute('aria-pressed', String(button.dataset.form === state.form));
  }
  build();
}

function paramsFor(index) {
  const random = rng(state.seed * 1000 + index * 7919);
  const config = state.config;
  const form = config.forms[state.form];
  const base = {};
  for (const [name, spec] of Object.entries(form.params)) base[name] = pick(random, spec);
  return {
    form: state.form,
    base,
    turn: pick(random, config.operators.turn),
    mirror: pick(random, config.operators.mirror),
    scale: pick(random, config.operators.scale),
    shear: pick(random, config.operators.shear),
    field: pick(random, config.operators.field),
    dither: pick(random, config.operators.dither),
    ascii: pick(random, config.operators.ascii),
    palette: [config.palette[Math.floor(random() * config.palette.length)], config.palette[Math.floor(random() * config.palette.length)]],
    phase: random() * Math.PI * 2,
  };
}

function canvas2d(canvas) {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

function drawValve(ctx, base, localR, colour, ox, oy) {
  ctx.save();
  ctx.translate(ox, oy);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = colour;
  ctx.lineWidth = Math.max(0.8, localR * 0.014);
  ctx.globalAlpha = 0.9;

  for (let ring = 0; ring < base.rings; ring += 1) {
    const rim = (ring + 1) / base.rings;
    ctx.beginPath();
    for (let s = 0; s <= 240; s += 1) {
      const a = (s / 240) * TAU;
      const raw = Math.sin(base.folds * a + ring * base.ringTurn + rim * base.ringTurn * 0.8);
      const shaped = Math.sign(raw) * Math.pow(Math.abs(raw), base.sharpness);
      const r = rim * (1 + base.depth * shaped) * localR;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  const last = base.rings - 1;
  const inner = (1 / base.rings) * 0.35;
  for (let i = 0; i < base.folds; i += 1) {
    const a = (Math.PI / 2 + TAU * i - last * base.ringTurn) / base.folds;
    ctx.beginPath();
    for (let s = 0; s <= 24; s += 1) {
      const t = inner + (s / 24) * (1 - inner);
      const raw = Math.sin(base.folds * a + last * base.ringTurn + t * base.rings * base.ringTurn * 0.8);
      const shaped = Math.sign(raw) * Math.pow(Math.abs(raw), base.sharpness);
      const r = t * (1 + base.depth * shaped) * localR;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function render(canvas, params, t) {
  const { ctx, w, h } = canvas2d(canvas);
  ctx.fillStyle = '#07080a';
  ctx.fillRect(0, 0, w, h);

  const size = Math.min(w, h);
  const R = size * 0.42 * params.scale;
  const matrices = { 2: BAYER2, 4: BAYER4, 8: BAYER8 };
  const matrix = matrices[params.dither] || BAYER4;
  const order = matrix.length;
  const step = Math.max(2, Math.round(size / 78));
  const colours = params.palette;

  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate((params.turn * Math.PI) / 180);
  if (params.mirror) ctx.scale(-1, 1);
  ctx.transform(1, 0, Math.tan((params.shear * Math.PI) / 180), 1, 0, 0);

  const localR = Math.max(14, R / params.field);
  const base = params.base;

  for (let fy = 0; fy < params.field; fy += 1) {
    for (let fx = 0; fx < params.field; fx += 1) {
      const ox = (fx - (params.field - 1) / 2) * localR * 2.15;
      const oy = (fy - (params.field - 1) / 2) * localR * 2.15;

      for (let y = -localR; y < localR; y += step) {
        for (let x = -localR; x < localR; x += step) {
          const u = x / localR;
          const v = y / localR;
          const d = Math.hypot(u, v);
          const a = Math.atan2(v, u);
          let inside = false;
          let light = 0;

          if (params.form === 'diatom') {
            // Multi-fold valve: rings, each folded folds times, each ring
            // turned against the one below, the fold running through both.
            if (d < 1.02) {
              const rings = base.rings;
              const ringF = Math.min(d, 0.9999) * rings;
              const ring = Math.floor(ringF);
              const rim = (ring + 1) / rings;
              const raw = Math.sin(base.folds * a + ring * base.ringTurn + ringF * base.ringTurn * 0.8);
              const shaped = Math.sign(raw) * Math.pow(Math.abs(raw), base.sharpness);
              const radius = rim * (1 + base.depth * shaped);
              if (d < radius) {
                inside = true;
                const band = 0.5 + 0.5 * shaped;
                const edge = Math.abs(d - radius) / Math.max(1e-4, radius * 0.02);
                light = Math.min(0.85, band * (0.25 + 0.6 * (1 - d / radius)) + (edge < 1 ? 0.3 : 0));
                if (base.pores > 0 && band > 0.82) {
                  const pore = Math.sin(base.folds * 2.2 * a + ring * 3.7) * Math.cos(base.folds * 1.4 * a - ringF);
                  if (pore > 1 - base.pores * 0.3) light *= 0.2;
                }
              }
            }
          } else {
            const wobble = 1 + base.amplitude * Math.sin(base.harmonics * a + params.phase + t * 0.0004)
              + base.secondary * Math.sin((base.harmonics + 2) * a - params.phase);
            if (d < wobble) {
              inside = true;
              light = Math.max(0.04, 1 - d / wobble);
            }
          }

          if (!inside) continue;

          const px = x + ox;
          const py = y + oy;
          const gx = Math.round((px + size) / step) % order;
          const gy = Math.round((py + size) / step) % order;
          if (light <= matrix[(gy + order) % order][(gx + order) % order]) continue;

          const colour = colours[(gx + gy) % 2];
          if (params.ascii > 0.01 && ((gx + gy) % 3 === 0)) {
            ctx.fillStyle = colour;
            ctx.font = `${Math.ceil(step * 2.1)}px 'DM Mono', ui-monospace, monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(GLYPHS[Math.min(GLYPHS.length - 1, Math.floor(light * GLYPHS.length))], px, py);
          } else {
            ctx.fillStyle = colour;
            ctx.fillRect(px, py, step, step);
          }
        }
      }

      if (params.form === 'diatom') {
        drawValve(ctx, base, localR, colours[0], ox, oy);
      }
    }
  }

  ctx.restore();
}

function build() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  state.draws = [];
  for (let i = 0; i < state.config.draws; i += 1) {
    const params = paramsFor(i);
    state.draws.push({ index: i, params });

    const cell = document.createElement('div');
    cell.className = 'draw';
    cell.dataset.index = String(i);
    cell.innerHTML = `<canvas></canvas>
      <span class="idx">DRAW ${String(i + 1).padStart(2, '0')}</span>
      <button class="keep" type="button">KEEP</button>
      <span class="ops">${params.form === 'diatom'
        ? `<b>${params.base.folds}F</b> · ${params.base.rings}R · depth ${params.base.depth.toFixed(2)} · sharp ${params.base.sharpness.toFixed(1)} · pore ${params.base.pores.toFixed(2)}`
        : `<b>${params.base.harmonics}H</b> · amp ${params.base.amplitude.toFixed(2)} · 2nd ${params.base.secondary.toFixed(2)}`} · turn ${params.turn}° · ${params.mirror ? 'mirror' : 'direct'} · field ${params.field} · ${params.dither}×${params.dither}</span>`;
    grid.appendChild(cell);

    const canvas = cell.querySelector('canvas');
    render(canvas, params, 0);

    cell.querySelector('.keep').addEventListener('click', () => {
      const key = `${state.seed}:${i}`;
      if (state.kept.has(key)) state.kept.delete(key);
      else state.kept.add(key);
      refresh();
    });
  }
  document.getElementById('seed').textContent = String(state.seed);
  refresh();
}

function refresh() {
  for (const cell of document.querySelectorAll('.draw')) {
    const index = Number(cell.dataset.index);
    const key = `${state.seed}:${index}`;
    const kept = state.kept.has(key);
    cell.classList.toggle('is-kept', kept);
    cell.querySelector('.keep').textContent = kept ? 'KEPT' : 'KEEP';
    cell.querySelector('.keep').setAttribute('aria-pressed', String(kept));
  }
  const list = [...state.kept].sort();
  document.getElementById('keptCount').textContent = String(list.length);
  document.getElementById('kept').textContent = list.length ? list.join(' · ') : 'none';
  document.getElementById('kept').onclick = () => navigator.clipboard?.writeText(list.join(' '));
  window.__study.kept = list.length;
}

let frame = 0;
function loop(now) {
  frame += 1;
  if (frame % 4 === 0) {
    for (const draw of state.draws) {
      const canvas = document.querySelector(`.draw[data-index="${draw.index}"] canvas`);
      if (canvas && canvas.getBoundingClientRect().top < innerHeight + 200) render(canvas, draw.params, now);
    }
  }
  window.__study.frames += 1;
  requestAnimationFrame(loop);
}

document.getElementById('reroll').addEventListener('click', () => {
  state.seed += 1;
  build();
});
document.getElementById('reset').addEventListener('click', () => {
  state.kept.clear();
  refresh();
});
for (const button of document.querySelectorAll('[data-form]')) {
  button.addEventListener('click', () => {
    state.form = button.dataset.form;
    for (const other of document.querySelectorAll('[data-form]')) {
      other.setAttribute('aria-pressed', String(other === button));
    }
    build();
  });
}
for (const button of document.querySelectorAll('[data-mode]')) {
  button.addEventListener('click', () => {
    state.mode = button.dataset.mode;
    for (const other of document.querySelectorAll('[data-mode]')) other.setAttribute('aria-pressed', String(other === button));
    for (const draw of state.draws) {
      if (state.mode === 'ascii') draw.params.ascii = 1;
      else draw.params.ascii = 0;
    }
    for (const draw of state.draws) {
      const canvas = document.querySelector(`.draw[data-index="${draw.index}"] canvas`);
      if (canvas) render(canvas, draw.params, performance.now());
    }
  });
}
addEventListener('resize', () => {
  for (const draw of state.draws) {
    const canvas = document.querySelector(`.draw[data-index="${draw.index}"] canvas`);
    if (canvas) render(canvas, draw.params, performance.now());
  }
});

load()
  .then(() => {
    window.__study.draws = state.draws.length;
    window.__study.ready = true;
    requestAnimationFrame(loop);
  })
  .catch((error) => { window.__study.error = String(error); console.error(error); });
</script>
</body>
</html>
