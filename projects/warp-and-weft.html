<script type="module">
  import { runStudy } from '../labs/engine/run.js';
  runStudy(document.querySelector('#view'), {
    weave: true,
    bladeScale: 0.82,
    chair: {
      url: '../labs/chair.gltf',
      position: [0.5, 0, -1.5],
      rotationY: -0.6,
      scale: 1.4,
      tint: [0.9, 0.9, 0.87],
      alignCell: true,
    },
    post: { glow: 0.45, grain: 0.021, vignette: 0.62 },
    path: { start: [2.6, 4.4], end: [0.5, -1.5] },

    pointerRadius: 2.4,
    wind: 1.35,
  });
